name: timelog
description: "TimeLog - suivi des heures, journal de travail et notes."
publish_to: 'none'

# version: <build-name>+<build-number> (versionName / versionCode on Android).
# Keep AppInfo.appVersion in lib/app_info.dart in sync (checked by a test).
version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  flutter_markdown_plus: ^1.0.12
  file_picker: ^13.3.2
  image_picker: ^1.2.4
  record: ^7.1.2
  audioplayers: ^6.8.1
  open_filex: ^5.0.0
  uuid: ^4.6.0
  archive: ^4.6.0
  url_launcher: ^6.3.3
  http: ^1.6.0
  sqflite_common_ffi_web: ^1.2.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png
    - assets/logo_glyph.png
